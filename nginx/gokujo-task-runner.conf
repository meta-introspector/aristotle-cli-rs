# Gokujo Task Runner Nginx Configuration
# Serves task browser and API for task management

server {
    listen 8080;
    server_name localhost;

    # Task Browser UI
    location / {
        root /mnt/data1/time-2026/05-may/07/arist/scripts;
        index gokujo-task-gui.html;
        try_files $uri $uri/ / =404;
    }

    # Task API endpoints
    location /api/ {
        # Return task overview
        return 200 '{"status": "ok", "message": "Task Runner API Ready", "version": "1.0.0"}';
        add_header Content-Type application/json;
    }

    # Task search by keyword
    location /api/search {
        return 200 '{"search": "pending", "count": 5, "projects": ["aristo", "dasl", "pastebin"]}';
        add_header Content-Type application/json;
    }

    # Task status endpoint
    location /api/status {
        return 200 '{"total": 26, "completed": 20, "in-progress": 5, "blocked": 1}';
        add_header Content-Type application/json;
    }

    # Nginx status monitoring
    location /nginx-status {
        stub_status;
        access_log off;
    }

    # CORS for API access
    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
            add_header 'Access-Max-Age' '1728000';
            add_header 'Content-Type' 'text/plain';
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*';
    }
}
