# Aristo proof API and WASM site, included from the solana.solfunmeme.com TLS vhost.
# The API prefix is more specific than /aristo/ and is rewritten to the local
# systemd service's native /api/v3 routes.
location = /aristo {
    return 301 /aristo/;
}

location ^~ /aristo/api/ {
    rewrite ^/aristo(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:9876;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    add_header Access-Control-Allow-Origin "*" always;
}

location = /aristo/health {
    proxy_pass http://127.0.0.1:9876/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin "*" always;
}

location ^~ /aristo/ {
    alias /mnt/data1/time-2026/05-may/07/arist/www/;
    index index.html;
    try_files $uri $uri/ /aristo/index.html;
    add_header Cache-Control "public, max-age=300";
}
